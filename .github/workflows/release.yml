name: release
# Builds prebuilt binaries on every version tag, e.g.:
#   git tag v0.1.0; git push --tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: m-ust.exe
            archive: m-ust-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: m-ust
            archive: m-ust-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: m-ust
            archive: m-ust-macos-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install ALSA (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: build
        run: cargo build --release --locked --bin m-ust --target ${{ matrix.target }}
      - name: archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" -DestinationPath "${{ matrix.archive }}"
      - name: archive (unix)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" "${{ matrix.bin }}"
      - name: upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
