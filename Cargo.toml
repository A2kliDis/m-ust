[package]
name = "m-ust"
version = "0.1.0"
edition = "2021"
description = "Song recognizer TUI - 100% Rust, 100% free"
license = "MIT"
repository = "https://github.com/A2kliDis/m-ust"
default-run = "m-ust"

[[bin]]
name = "m-ust"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls-manual-roots"] }
hound = "3.5"
rustfft = "6.2"
chfft = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
bytes = "1.6"
futures = "0.3"
strum = { version = "0.27", features = ["derive"] }
byteorder = "1.5"
crc32fast = "1.4"
base64 = "0.22"
uuid = { version = "1.8", features = ["v4"] }
rand = "0.8"
which = "6.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.15"
sysinfo = "0.32"
windows = { version = "0.54", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[profile.release]
lto = true
strip = true
